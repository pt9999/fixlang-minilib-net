[general]
name = "minilib-net"
version = "0.9.0-beta.1"
fix_version = "1.6.0"
authors = ["pt9999"]
license = "MIT"

[build]
opt_level = "basic"
files = [
    "lib/net/html.fix",
    "lib/net/http_server.fix",
    "lib/net/request.fix",
    "lib/net/router.fix",
    "lib/net/tcp.fix",
    "lib/net/url.fix",
]
objects = ["lib.o"]
preliminary_commands = [["make", "lib.o"]]

[build.test]
threaded = true
opt_level = "basic"
files = [
    "tests/test.fix",
    "tests/net/html_test.fix",
    "tests/net/request_test.fix",
    "tests/net/router_test.fix",
    "tests/net/tcp_test.fix",
    "tests/net/url_test.fix",
]

[[dependencies]]
name = "character"
version = "1.0.1"
git = { url = "https://github.com/tttmmmyyyy/fixlang-character.git" }

[[dependencies]]
name = "hashmap"
version = "2.1.0"
git = { url = "https://github.com/tttmmmyyyy/fixlang-hashmap.git" }

[[dependencies]]
name = "asynctask"
version = "2.0.1"
git = { url = "https://github.com/tttmmmyyyy/fixlang-asynctask.git" }

[[dependencies]]
name = "minilib-common"
version = "0.15.0"
# path = "../fixlang-minilib-common"
git = { url = "https://github.com/pt9999/fixlang-minilib-common.git" }

[[dependencies]]
name = "minilib-text"
version = "0.11.0"
# path = "../fixlang-minilib-text"
git = { url = "https://github.com/pt9999/fixlang-minilib-text.git" }

[[dependencies]]
name = "minilib-binary"
version = "0.8.0"
# path = "../fixlang-minilib-binary"
git = { url = "https://github.com/pt9999/fixlang-minilib-binary.git" }

[[dependencies]]
name = "minilib-io"
version = "0.10.0"
# path = "../fixlang-minilib-io"
git = { url = "https://github.com/pt9999/fixlang-minilib-io.git" }

[[dependencies]]
name = "minilib-xml"
version = "0.8.0"
# path = "../fixlang-minilib-xml"
git = { url = "https://github.com/pt9999/fixlang-minilib-xml.git" }
